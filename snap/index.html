<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b6079">
<title>即影即撕 Snap &amp; Peel</title>
<style>
:root{--ink:#1d1b2e;--bg:#5b6079;--bg2:#4a4e66;--cream:#fff7e8;--paper:#fbf6ea;--yel:#ffcf33;--red:#ff5a4e;--teal:#2fb5a9;--blue:#3d6bff;--pink:#ff8fb3;--mint:#9ff0c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none;font-variant-numeric:tabular-nums}
body{background:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px) 0 0/24px 24px,radial-gradient(120% 90% at 50% 40%,#646a86 0%,var(--bg) 55%,var(--bg2) 100%) fixed}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}
.btn{position:relative;font-weight:900;font-size:18px;padding:14px 24px;border:3px solid var(--ink);border-radius:16px;background:var(--yel);box-shadow:0 5px 0 var(--ink),0 8px 18px rgba(20,18,40,.25);cursor:pointer;letter-spacing:.03em;transition:transform .07s,box-shadow .07s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),0 3px 8px rgba(20,18,40,.2)}
.btn.alt{background:var(--cream)}
.btn small{font-size:12px;font-weight:800;background:rgba(29,27,46,.12);padding:2px 8px;border-radius:20px}
.ib{width:44px;height:44px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:17px;display:grid;place-items:center;cursor:pointer;padding:0;flex:none;transition:transform .07s,box-shadow .07s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* home */
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco canvas{position:absolute;height:auto;filter:drop-shadow(0 6px 6px rgba(20,18,40,.3));animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -8px}}
.logowrap{position:relative;transform:rotate(-5deg);margin-bottom:4px}
.logo{position:relative;margin:0;padding:10px 26px 14px;font-weight:900;font-size:clamp(54px,15vw,92px);line-height:1;letter-spacing:.06em;color:var(--ink);background:var(--yel);border-radius:22px;box-shadow:0 0 0 7px #fff,0 0 0 10px rgba(29,27,46,.12),0 14px 24px rgba(20,18,40,.35)}
.logo::after{content:"";position:absolute;right:-7px;top:-7px;width:46px;height:46px;border-radius:0 22px 0 14px;background:linear-gradient(225deg,var(--bg) 0 48%,#e9e4d8 50%,#fff 100%);box-shadow:-4px 4px 8px rgba(20,18,40,.25)}
.logo span{display:block;font-size:.17em;letter-spacing:.32em;margin-top:6px;opacity:.75}
.stats{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,247,232,.12);border:2px solid rgba(255,247,232,.25);color:var(--cream);border-radius:14px;padding:6px 12px;font-size:12px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stat b{display:block;font-size:20px;font-weight:900}
.card{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(20,18,40,.25);padding:16px 18px;max-width:380px;width:100%}
.steps{display:grid;gap:10px;text-align:left}
.steps div{display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.45}
.steps i{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:15px}
.homebtns{position:relative;display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
.best{font-size:13px;opacity:.85;margin-top:6px}

/* game */
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#cv:active{cursor:grabbing}
.hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:12px 14px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud.top{top:0;padding-top:max(12px,env(safe-area-inset-top));flex-wrap:wrap}
.hud.bot{bottom:0;flex-direction:column;align-items:center;padding-bottom:max(18px,env(safe-area-inset-bottom));gap:10px}
.hud.bot>*{pointer-events:none}
.count{font-weight:900;font-size:16px;color:var(--cream);text-shadow:0 2px 0 var(--ink);min-width:58px;line-height:1}
.count b{font-size:28px}
.tally{display:flex;gap:5px;margin-left:auto}
.tally span{display:flex;align-items:center;gap:4px;white-space:nowrap;background:var(--cream);border:2.5px solid var(--ink);border-radius:20px;padding:4px 9px 4px 6px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.tally i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.t-p i{background:var(--yel)}.t-r i{background:linear-gradient(90deg,#fff 50%,#aab4c0 50%)}.t-t i{background:var(--red)}
.book{background:var(--yel)}
.book.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.28) rotate(-10deg)}}
.prog{flex-basis:100%;display:flex;gap:2px;height:7px;margin-top:4px}
.prog span{flex:1;border-radius:3px;background:rgba(255,247,232,.18)}
.prog span.p{background:var(--yel)}.prog span.r{background:#c7d0dc}.prog span.t{background:var(--red)}
.prog span.c{background:var(--cream);box-shadow:0 0 0 2px var(--ink);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.chip{display:flex;align-items:center;gap:8px;background:var(--cream);border:2.5px solid var(--ink);border-radius:30px;padding:5px 14px 5px 6px;font-size:13px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.sw-thermal{background:repeating-linear-gradient(90deg,#f7f4ec 0 3px,#d9d4c6 3px 4px)}
.sw-paper{background:linear-gradient(135deg,#fff 40%,#e8e2d2)}
.sw-kraft{background:#c9a26b}
.sw-vinyl{background:radial-gradient(circle at 35% 30%,#fff 0 18%,#7fd3ff 20%,#3d6bff)}
.sw-holo{background:conic-gradient(#ff8fb3,#ffcf33,#9ff0c6,#46c8ff,#8a63ff,#ff8fb3)}
.chip.holo{background:linear-gradient(90deg,#ffe3f3,#e0f2ff,#e8ffe0,#fff6d0)}
.meterwrap{display:flex;align-items:center;gap:10px;width:100%;max-width:440px}
.meterwrap label{font-size:12px;font-weight:900;color:var(--cream);text-shadow:0 2px 0 var(--ink);flex:none}
.meter{position:relative;flex:1;height:18px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink);background:linear-gradient(90deg,#e4f7f1 0 45.8%,#fff3c9 45.8% 83.3%,#ffd9d4 83.3%)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teal);border-right:3px solid var(--ink);transition:background .15s}
.meter .fill:after{content:"";position:absolute;left:0;right:0;top:2px;height:4px;border-radius:3px;background:rgba(255,255,255,.45)}
.warn{font-weight:900;font-size:15px;color:var(--cream);text-shadow:0 2px 0 var(--ink);min-height:20px;text-align:center}
.warn.bad{color:#ffa79e}.warn.mid{color:var(--yel)}.warn.ok{color:var(--mint)}
.toast{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%) scale(.5) rotate(-6deg);opacity:0;pointer-events:none;font-weight:900;font-size:30px;padding:10px 24px 12px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 0 0 6px #fff,0 0 0 8px rgba(29,27,46,.15),0 14px 24px rgba(20,18,40,.35);background:var(--cream);white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
.toast small{display:block;font-size:13px;font-weight:800;opacity:.7;margin-top:2px}
.toast.perfect{background:var(--yel)}.toast.residue{background:#e4ebf3}.toast.torn{background:var(--red);color:#fff}
.modal{position:absolute;inset:0;background:rgba(29,27,46,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.on{display:flex}
.modal .card h3{margin:2px 0 14px;font-size:22px}

/* result */
#result.on{display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:30px 16px 40px;gap:18px}
#result .logo{font-size:44px;padding:8px 22px 10px}
.big{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.02em}
.rrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.rrow div{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 6px;font-weight:900;font-size:22px;text-align:center}
.rrow div small{display:block;font-size:11px;opacity:.65;font-weight:800}
.rrow .p{background:#fff3c4}.rrow .t{background:#ffe1dc}
.newbest{display:inline-block;background:var(--red);color:#fff;font-weight:900;padding:4px 12px;border-radius:10px;transform:rotate(-4deg);box-shadow:0 0 0 4px #fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:14px}
.grid .g{position:relative;aspect-ratio:1;display:grid;place-items:center;background:#f3ecdc;border-radius:12px}
.grid canvas{max-width:86%;max-height:86%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(30,25,40,.25))}
.badge{position:absolute;right:-4px;top:-6px;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(90deg,#fff 50%,#aab4c0 50%)}
.badge.p{background:var(--yel)}.badge.t{background:var(--red)}

/* album */
#album.on{display:flex;flex-direction:column}
.abar{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.abar h2{margin:0;font-size:22px;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.pnav{margin-left:auto;display:flex;align-items:center;gap:6px}
.pnav span{font-weight:900;color:var(--cream);min-width:44px;text-align:center;text-shadow:0 2px 0 var(--ink)}
#pagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#page{position:relative;background:radial-gradient(rgba(29,27,46,.12) 1.2px,transparent 1.4px) 0 0/22px 22px,linear-gradient(90deg,rgba(0,0,0,.07),transparent 7%),var(--paper);border:3px solid var(--ink);border-radius:6px 14px 14px 6px;box-shadow:0 7px 0 var(--ink),0 16px 30px rgba(20,18,40,.35);overflow:hidden;touch-action:none}
#page::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:12px;background:radial-gradient(circle,var(--bg) 0 4.5px,rgba(29,27,46,.35) 5px,transparent 6px) 0 6px/12px 34px repeat-y;pointer-events:none}
#page .item{position:absolute;left:0;top:0;transform-origin:50% 50%;cursor:grab;filter:drop-shadow(0 2px 1.5px rgba(30,25,40,.3))}
#page .item canvas{width:100%;height:100%;display:block;pointer-events:none}
#page .item.sel{outline:2px dashed rgba(29,27,46,.55);outline-offset:6px}
.hdl{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--ink);border-radius:50%;background:var(--yel);display:none;place-items:center;font-weight:900;font-size:15px;z-index:1000;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.hdl.on{display:grid}
.h-del{background:var(--red);color:#fff}
.pageempty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(29,27,46,.35);font-weight:900;font-size:15px;pointer-events:none;text-align:center;padding:30px}
.tray{position:relative;background:var(--cream);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;padding:14px 0 max(10px,env(safe-area-inset-bottom));box-shadow:0 -8px 20px rgba(20,18,40,.2)}
.tray::before{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(29,27,46,.2)}
.trayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 6px;font-size:13px;font-weight:800}
.trayhd .tip{opacity:.55;font-weight:600;font-size:12px}
.traylist{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 8px;touch-action:pan-x;min-height:90px;align-items:center;scrollbar-width:none}
.traylist::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:none;width:78px;height:78px;display:grid;place-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.thumb canvas{height:auto;max-width:84%;max-height:84%;pointer-events:none;filter:drop-shadow(0 2px 1.5px rgba(30,25,40,.25))}
.trayempty{font-size:14px;opacity:.6;padding:22px 0}

/* ===== snap: camera / review / reveal / done ===== */
#cam{background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video.mirror{transform:scaleX(-1)}
.reticle{position:absolute;left:50%;top:50%;width:min(64vw,52vh);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;border-radius:30px;box-shadow:0 0 0 9999px rgba(10,10,22,.32)}
.reticle i{position:absolute;width:38px;height:38px;border:5px solid #fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:24px 0 0 0}
.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 24px 0 0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 24px}
.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 24px 0}
.reticle b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--yel);box-shadow:0 0 0 3px var(--ink),0 0 0 6px #fff}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
.pillmsg{background:rgba(29,27,46,.72);color:var(--cream);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:800;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.camhint{position:absolute;left:0;right:0;top:calc(50% + min(32vw,26vh) + 18px);text-align:center;pointer-events:none}
.cambot{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:46px;padding:20px;padding-bottom:max(30px,env(safe-area-inset-bottom))}
.shutter{width:82px;height:82px;border-radius:50%;border:6px solid #fff;background:var(--yel);box-shadow:0 0 0 3px var(--ink),0 8px 20px rgba(0,0,0,.4);cursor:pointer;padding:0;transition:transform .08s}
.shutter:active{transform:scale(.9)}
.cambot .ib{opacity:.95}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.flash.on{opacity:1;transition:none}
#review.on{display:flex;flex-direction:column}
.rvtop{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.rvwrap{position:relative;flex:1;min-height:0}
#rvc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.rvbot{display:flex;gap:12px;padding:14px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.rvbot .btn{flex:1}
.btn:disabled{opacity:.45;pointer-events:none}
.spin{display:inline-block;width:14px;height:14px;border:3px solid rgba(255,247,232,.35);border-top-color:var(--yel);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.reveal .card{text-align:center;max-width:340px}
.reveal canvas{display:block;margin:4px auto 12px;max-width:62%;height:auto;filter:drop-shadow(0 8px 10px rgba(20,18,40,.35));animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.matbig{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:900;padding:6px 16px 6px 8px;border:3px solid var(--ink);border-radius:30px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.matbig .sw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink)}
.why{font-size:14px;margin:10px 0 12px;font-weight:700;opacity:.8}
.bars{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;text-align:left;font-size:12px;font-weight:800;margin-bottom:14px}
.bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.once{font-size:12px;font-weight:800;color:var(--red);margin-top:10px}
.done .card{text-align:center;max-width:340px}
.done canvas{display:block;margin:0 auto 10px;max-width:70%;height:auto;filter:drop-shadow(0 8px 10px rgba(20,18,40,.35))}
.done h3{font-size:28px;margin:4px 0}
.done .btns{display:grid;gap:10px;margin-top:14px}
.recent{position:relative;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:20px}
.recent canvas{height:auto;filter:drop-shadow(0 4px 4px rgba(20,18,40,.35))}
.recent canvas:nth-child(odd){transform:rotate(-6deg)}.recent canvas:nth-child(even){transform:rotate(5deg)}
.recent .empty{color:var(--cream);opacity:.6;font-size:13px;font-weight:700}
.mdl{position:relative;font-size:12px;color:var(--cream);opacity:.75;font-weight:700}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="logowrap"><h1 class="logo">即影即撕<span>SNAP &amp; PEEL</span></h1></div>
  <div class="stats" id="homeStats"></div>
  <div class="recent" id="recent"></div>
  <div class="card">
    <div class="steps">
      <div><i style="background:var(--yel)">1</i><span><b>影一張相</b>：將物件放喺中間</span></div>
      <div><i style="background:#d9f1ff">2</i><span>AI <b>自動摳底</b>，按相片特徵決定材質</span></div>
      <div><i style="background:#ffd9d4">!</i><span><b>每張相只可以撕一次</b>，想撕得靚啲就要再影過</span></div>
    </div>
  </div>
  <div class="homebtns">
    <button class="btn" id="btnSnap">影相做貼紙</button>
    <button class="btn alt" id="btnAlbum">貼紙簿</button>
  </div>
  <div class="mdl" id="mdl"></div>
</section>

<!-- CAMERA -->
<section id="cam" class="screen">
  <video id="video" playsinline muted autoplay></video>
  <div class="reticle"><i></i><i></i><i></i><i></i><b></b></div>
  <div class="camtop">
    <button class="ib" id="btnCamBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="pillmsg" id="camMdl"></span>
  </div>
  <div class="camhint"><span class="pillmsg">物件對準中間 · 背景簡單啲會摳得靚啲</span></div>
  <div class="cambot">
    <span style="width:44px"></span>
    <button class="shutter" id="btnShutter" aria-label="影相"></button>
    <button class="ib" id="btnFlip" title="轉鏡頭"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
  </div>
  <div class="flash" id="flash"></div>
  <div class="modal" id="camErr"><div class="card" style="text-align:center"><h3>開唔到相機</h3><p id="camErrMsg" style="font-size:14px;line-height:1.6"></p><div style="display:grid;gap:10px;margin-top:12px"><button class="btn" id="btnCamRetry">再試</button><button class="btn alt" id="btnCamHome">返主頁</button></div></div></div>
</section>

<!-- REVIEW -->
<section id="review" class="screen">
  <div class="rvtop">
    <button class="ib" id="btnRvBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="pillmsg" id="rvStatus"></span>
  </div>
  <div class="rvwrap"><canvas id="rvc"></canvas></div>
  <div class="rvbot">
    <button class="btn alt" id="btnRetake">重影</button>
    <button class="btn" id="btnMake" disabled>做成貼紙</button>
  </div>
  <div class="modal reveal" id="reveal">
    <div class="card">

<script>
'use strict';
/* ================= utils ================= */
const TAU=Math.PI*2, INK='#1d1b2e';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let DPR=Math.min(window.devicePixelRatio||1,2);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(i,j,s){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const rint=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function matPick(r,t){let x=r();for(const[m,p]of t){if((x-=p)<0)return m}return t[t.length-1][0]}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.moveTo(x+r,y);c.arc(x,y,r,0,TAU)}
function poly(c,x,y,R,r,n,rot){for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*TAU,q=i%2?r:R;i?c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):c.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function fitFont(c,text,fam,wt,size,maxW){while(size>7){c.font=`${wt} ${size}px ${fam}`;if(c.measureText(text).width<=maxW)break;size-=1}return size}
const MC=mkCanvas(4,4).getContext('2d');
const NOISE=(()=>{const n=160,c=mkCanvas(n,n),x=c.getContext('2d'),d=x.createImageData(n,n);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c})();
const HALF=(()=>{const c=mkCanvas(5,5),x=c.getContext('2d');x.fillStyle='rgba(29,27,46,.09)';x.beginPath();x.arc(2.5,2.5,1.1,0,TAU);x.fill();return c})();
let uidN=0;const uid=()=>Date.now().toString(36)+(uidN++).toString(36)+Math.floor(Math.random()*1296).toString(36);

/* ================= style constants ================= */
const COLS=['#ff5a4e','#ffcf33','#2fb5a9','#3d6bff','#ff8fb3','#8a63ff','#6bd36b','#ff9a3d','#46c8ff'];
const F_BLACK='"Arial Black","Helvetica Neue",Arial,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif';
const F_CJK='"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif';
const F_MONO='"Courier New",Menlo,Consolas,monospace';
const F_HAND='"Marker Felt","Chalkboard SE","Comic Sans MS","Segoe Print",cursive';

/* Materials: maxV = front speed (units/s ÷ 400) before tension hits 1 */
const MATS={
  thermal:{name:'熱感紙',tip:'好易留白底',maxV:1.3,res:1.35,tol:20,tear:1.0,back:'#f2efe6',resCol:'#f7f4ec',gloss:.06},
  paper:{name:'銅版紙',tip:'中規中矩',maxV:1.7,res:1.0,tol:26,tear:1.0,back:'#fbfaf5',resCol:'#fdfcf8',gloss:.3},
  kraft:{name:'牛皮紙',tip:'纖維多，易起毛',maxV:1.5,res:1.2,tol:24,tear:1.1,back:'#e9dcc4',resCol:'#e6d6ba',gloss:.04},
  vinyl:{name:'PVC 膠貼',tip:'韌，可以快少少',maxV:2.6,res:.4,tol:38,tear:.55,back:'#eef1f3',resCol:'rgba(240,244,247,.85)',gloss:.55},
  holo:{name:'鐳射貼',tip:'稀有！好脆',maxV:1.3,res:.55,tol:28,tear:1.7,back:'#d6d9e0',resCol:'#e4e6ec',gloss:.7,holo:true},
};
const SPEED_NORM=400, GAIN=1.6;

function renderArt(spec,ppu){
  const c=mkCanvas(spec.w*ppu,spec.h*ppu),x=c.getContext('2d');
  x.save();x.setTransform(ppu,0,0,ppu,0,0);spec.draw(x);x.restore();
  x.globalCompositeOperation='source-atop';
  if(spec.mat==='holo'){const q=mulberry32(spec.seed^777);x.setTransform(ppu,0,0,ppu,0,0);x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;for(let k=-spec.h;k<spec.w;k+=7){x.beginPath();x.moveTo(k,0);x.lineTo(k+spec.h,spec.h);x.stroke()}
    x.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<spec.w*spec.h/900;k++){const px=q()*spec.w,py=q()*spec.h,rr2=1+q()*3.2;x.beginPath();poly(x,px,py,rr2*1.8,rr2*.4,4,0);x.fill()}x.setTransform(1,0,0,1,0,0)}
  if(spec.mat==='paper'||spec.mat==='kraft'){x.globalAlpha=.5;x.fillStyle=x.createPattern(HALF,'repeat');x.fillRect(0,0,c.width,c.height)}
  x.globalAlpha=.07;x.fillStyle=x.createPattern(NOISE,'repeat');x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  return c;
}
function gridOf(w,h){const cs=Math.max(w,h)/36;return{cs,gx:Math.ceil(w/cs),gy:Math.ceil(h/cs)}}
function drawResBlob(c,x,y,cs,i,j,seed){
  for(let k=0;k<3;k++){const ox=(hash2(i*3+k,j,seed+11)-.5)*cs*.9,oy=(hash2(i,j*3+k,seed+23)-.5)*cs*.9,rad=cs*(.42+hash2(i+k,j-k,seed+5)*.45);c.beginPath();c.arc(x+ox,y+oy,rad,0,TAU);c.fill()}
}
function buildResMask(w,h,seed,idxs,ppu){
  const {cs,gx}=gridOf(w,h),c=mkCanvas(w*ppu,h*ppu),x=c.getContext('2d');x.setTransform(ppu,0,0,ppu,0,0);x.fillStyle='#fff';
  for(const idx of idxs){const i=idx%gx,j=Math.floor(idx/gx);drawResBlob(x,(i+.5)*cs,(j+.5)*cs,cs,i,j,seed)}
  return c;
}
function encRes(cells,n){const b=new Uint8Array(Math.ceil(n/4));for(const c of cells)if(c.res)b[c.idx>>2]|=1<<(c.idx&3);return Array.from(b,v=>v.toString(16)).join('')}
function decRes(hex){const o=[];if(!hex)return o;for(let k=0;k<hex.length;k++){const b=parseInt(hex[k],16);for(let q=0;q<4;q++)if(b>>q&1)o.push(k*4+q)}return o}
function jagPts(t,w,h){const px=-t.ny,py=t.nx,L=w+h,bx=t.nx*t.c,by=t.ny*t.c,pts=[];for(let u=-L;u<=L;u+=4){const off=(vnoise(u/16+50,3.3,t.s)-.5)*16+(hash2(Math.round(u),7,t.s)-.5)*5;pts.push([bx+px*u+t.nx*off,by+py*u+t.ny*off])}return pts}
function jagPath(c,t,w,h,side){const p=jagPts(t,w,h),L=(w+h)*3,f=p[0],l=p[p.length-1];c.moveTo(f[0],f[1]);for(const q of p)c.lineTo(q[0],q[1]);c.lineTo(l[0]+side*t.nx*L,l[1]+side*t.ny*L);c.lineTo(f[0]+side*t.nx*L,f[1]+side*t.ny*L);c.closePath()}
function jagLine(c,t,w,h){const p=jagPts(t,w,h);c.moveTo(p[0][0],p[0][1]);for(const q of p)c.lineTo(q[0],q[1])}
function rainbow(c,w,h,lx,tm){const g=c.createLinearGradient(0,h,w,0);for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${(i*55+lx*300+tm*25)%360},95%,62%)`);return g}
function sheenGrad(c,w,h,lx,a){const g=c.createLinearGradient(-.5*w,-.5*h,1.5*w,1.5*h),p=clamp(lx*1.4-.2,-.3,1.3),o=(p+.5)/2;const W='rgba(255,255,255,';g.addColorStop(0,W+'0)');g.addColorStop(o-.1,W+'0)');g.addColorStop(o-.03,W+(a*.35)+')');g.addColorStop(o,W+a+')');g.addColorStop(o+.025,W+(a*.35)+')');g.addColorStop(o+.09,W+'0)');g.addColorStop(1,W+'0)');return g}

/* Render a collected sticker exactly as it was peeled */
function renderRecord(rec,ppu){
  const spec=specFor(rec),w=spec.w,h=spec.h,art=renderArt(spec,ppu);
  const out=mkCanvas(art.width,art.height),o=out.getContext('2d');o.drawImage(art,0,0);
  if(MATS[spec.mat].holo){o.setTransform(ppu,0,0,ppu,0,0);o.globalCompositeOperation='overlay';o.globalAlpha=.6;o.fillStyle=rainbow(o,w,h,.35,0);o.fillRect(0,0,w,h);o.globalCompositeOperation='screen';o.globalAlpha=1;o.fillStyle=sheenGrad(o,w,h,.45,.5);o.fillRect(0,0,w,h);o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation='destination-in';o.drawImage(art,0,0)}
  const idxs=decRes(rec.res);
  if(idxs.length){const m=buildResMask(w,h,rec.seed,idxs,ppu);o.globalCompositeOperation='destination-out';o.globalAlpha=.5;o.drawImage(m,0,0);o.globalCompositeOperation='source-atop';o.globalAlpha=.4;o.drawImage(m,0,0)}
  o.globalCompositeOperation='source-over';o.globalAlpha=1;
  if(rec.tear){
    const pc=mkCanvas(out.width,out.height),p=pc.getContext('2d');
    p.setTransform(ppu,0,0,ppu,0,0);p.beginPath();jagPath(p,rec.tear,w,h,-1);p.clip();
    p.setTransform(1,0,0,1,0,0);p.drawImage(out,0,0);
    p.setTransform(ppu,0,0,ppu,0,0);p.globalCompositeOperation='source-atop';p.lineJoin='round';
    p.strokeStyle='rgba(255,255,255,.55)';p.lineWidth=8;p.beginPath();jagLine(p,rec.tear,w,h);p.stroke();
    p.strokeStyle='rgba(255,255,255,.95)';p.lineWidth=3.2;p.stroke();
    return pc;
  }
  return out;
}

/* ================= sound ================= */
const Snd={on:true,ac:null,lastScratch:0,
  init(){
    // iOS: play through the silent switch (Safari 16.4+), plus a looping silent <audio> as fallback
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    if(!this.el){try{const n=4000,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
      w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);
      const el=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));el.loop=true;el.setAttribute('playsinline','');el.volume=.01;this.el=el}catch(e){}}
    if(this.el&&this.el.paused){const p=this.el.play();p&&p.catch(()=>{})}
    if(this.ac){if(this.ac.state!=='running')this.ac.resume().catch(()=>{});return}
    try{const ac=new(window.AudioContext||window.webkitAudioContext)();this.ac=ac;
      const comp=ac.createDynamicsCompressor();comp.connect(ac.destination);this.out=comp;
      const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()<.03?(Math.random()*2-1):(Math.random()*2-1)*.22;
      this.buf=buf;const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
      const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=.7;
      const gn=ac.createGain();gn.gain.value=0;src.connect(bp).connect(gn).connect(this.out);src.start();this.bp=bp;this.gn=gn;
    }catch(e){this.ac=null}
  },
  peel(v,T){if(!this.ac)return;const t=this.ac.currentTime;this.gn.gain.setTargetAtTime(this.on?clamp(v,0,1.3)*.55:0,t,.04);this.bp.frequency.setTargetAtTime(700+clamp(T,0,1.5)*2600,t,.05)},
  burst(dur,freq,vol,type){if(!this.ac||!this.on)return;const ac=this.ac,t=ac.currentTime,s=ac.createBufferSource();s.buffer=this.buf;const f=ac.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(this.out);s.start(t,Math.random());s.stop(t+dur+.05)},
  tone(f,dur,vol,delay){if(!this.ac||!this.on)return;const ac=this.ac,t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(this.out);o.start(t);o.stop(t+dur+.05)},
  rip(){this.burst(.4,900,.9,'highpass');this.burst(.18,300,.5,'lowpass')},
  scratch(){const n=performance.now();if(n-this.lastScratch<90)return;this.lastScratch=n;this.burst(.08,2500,.5,'bandpass')},
  chime(){this.tone(880,.3,.3);this.tone(1320,.45,.25,.09);this.tone(1760,.5,.16,.18)},
  soft(){this.tone(523,.22,.25);this.tone(659,.3,.18,.08)},
  shutter(){this.burst(.09,2200,.7,'highpass');this.tone(1400,.05,.12,.06)},
  pop(){this.tone(420,.12,.25)},
};

/* ================= storage ================= */
const KEY='peel-snap-v1';
let DB=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.inv&&d.pages)return d}catch(e){}return null})()||{inv:[],pages:[[]],seenTut:false,shots:0,wasted:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){console.warn('save failed',e)}}
// sticker images live in IndexedDB; metadata stays in localStorage
const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('peel-snap',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
};
const IMG=new Map();
function blobToImg(b){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(b)})}
async function ensureImgs(recs){await Promise.all(recs.filter(r=>!IMG.has(r.img)).map(async r=>{try{const b=await IDB.get(r.img);if(b)IMG.set(r.img,await blobToImg(b))}catch(e){console.warn(e)}}))}
function specFor(rec){const im=IMG.get(rec.img);return{w:rec.w,h:rec.h,mat:rec.mat,seed:rec.seed,img:rec.img,kind:'photo',name:'相片貼紙',surface:'sheet',draw(c){if(im)c.drawImage(im,0,0,rec.w,rec.h)}}}
const hasImg=rec=>IMG.has(rec.img);

/* ================= screens ================= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='home')buildHome();if(id!=='game')Snd.peel(0,0);if(id!=='cam')stopCam()}
async function buildHome(){

const PARTS=[];

  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if($('#game').classList.contains('on')){
    LX+=(lxT+Math.sin(now/2300)*.08-LX)*.12;

/* pointer on game canvas */

  Snd.init();const S=cur;if(!S||S.ptr!=null||S.appear<1)return;
  if(S.state!=='idle'&&S.state!=='peeling')return;
  e.preventDefault();lxT=e.clientX/GW;
  const p=toLocal(S,e.clientX,e.clientY);setTP(e);
  S.arm=null;
  if(S.state==='idle'){
    S.zone=Math.max(14,40/S.k);
    if(isEdge(S,p.x,p.y,S.zone))startPeel(S,p);
    else if(alphaAt(S,p.x,p.y)>100)S.arm={x:p.x,y:p.y};

  }

});

let TP=null;
function setTP(e){const r=cv.getBoundingClientRect();TP={x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointermove',e=>{
  lxT=clamp(e.clientX/GW,0,1);const S=cur;if(!S||e.pointerId!==S.ptr)return;
  setTP(e);
  if(S.arm){
    // pressed inside the sticker: once the finger moves, start from the edge behind the drag direction
    const p=toLocal(S,e.clientX,e.clientY),dx=p.x-S.arm.x,dy=p.y-S.arm.y,L=Math.hypot(dx,dy);
    if(L*S.k<10)return;
    const ux=dx/L,uy=dy/L;let qx=S.arm.x,qy=S.arm.y;
    for(let t=0;t<S.w+S.h;t+=S.cs*.4){qx=S.arm.x-ux*t;qy=S.arm.y-uy*t;if(alphaAt(S,qx,qy)<=100)break}
    startPeel(S,{x:qx+ux*S.cs*.3,y:qy+uy*S.cs*.3});S.arm=null;S.down=p;S.grabT=0;S.v=0;S.moveAcc=0;
    return;
  }
  if(S.state!=='peeling')return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of(evs.length?evs:[e])){const p=toLocal(S,ev.clientX,ev.clientY);const NP={x:S.base.x+GAIN*(p.x-S.down.x),y:S.base.y+GAIN*(p.y-S.down.y)};S.moveAcc+=Math.hypot(NP.x-S.P.x,NP.y-S.P.y);S.P=NP}
});

function hud(full){
  if(full&&cur){const m=cur.mat;const ch=$('#hMat');ch.innerHTML=`<i class="sw sw-${cur.spec.mat}"></i><b>${m.name}</b><span style="opacity:.7">${m.tip}</span>`;ch.classList.toggle('holo',!!m.holo)}
  const S=cur;if(!S)return;
  const T=S.state==='peeling'?S.T:0,fill=clamp(T/1.2,0,1);
  if(Math.abs(fill-lastFill)>.004){lastFill=fill;const el=$('#hFill');el.style.width=(fill*100)+'%';el.style.background=T>1?'#ff5a4e':T>.55?'#ffcf33':'#2fb5a9'}
  if(performance.now()<warnUntil)return;
  if(S.state==='idle')setWarn('撳住貼紙，慢慢拉開佢','');
  else if(S.state==='peeling'){
    if(S.ptr==null)setWarn(`撳住繼續撕 · ${Math.round(S.pf*100)}%`,'');
    else if(T>1)setWarn('太快！要爛喇！','bad');
    else if(T>.55)setWarn('慢啲…會留白底','mid');
    else if(S.A>0)setWarn('方向偏咗，向貼紙中間拉','mid');
    else setWarn(`好！保持呢個速度 · ${Math.round(S.pf*100)}%`,'ok');
  }else setWarn('','');
}

const CAM={stream:null,facing:'environment'};
async function openCam(){
  show('cam');$('#camErr').classList.remove('on');SEG.load();
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camErr(location.protocol==='file:'?'用檔案直接開唔到相機，請用 https 網址開。':'呢個瀏覽器唔支援相機。請用 Safari 或 Chrome 打開（唔好喺 WhatsApp 入面開）。');return}
  try{
    stopCam();CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:CAM.facing},width:{ideal:1920},height:{ideal:1920}},audio:false});
    const v=$('#video');v.srcObject=CAM.stream;v.classList.toggle('mirror',CAM.facing==='user');await v.play();
  }catch(e){camErr(e&&e.name==='NotAllowedError'?'相機權限被拒。去瀏覽器設定 → 網站設定 → 相機，改返「允許」再試。':'開唔到相機：'+(e&&e.message||e))}
}
function stopCam(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}}
function camErr(t){$('#camErrMsg').textContent=t;$('#camErr').classList.add('on')}
function snap(){
  const v=$('#video');if(!v.videoWidth)return;
  const vw=v.videoWidth,vh=v.videoHeight,ar=innerWidth/innerHeight;let sx=0,sy=0,sw=vw,sh=vh;
  if(vw/vh>ar){sw=vh*ar;sx=(vw-sw)/2}else{sh=vw/ar;sy=(vh-sh)/2}
  const sc=Math.min(1,720/Math.max(sw,sh)),c=mkCanvas(sw*sc,sh*sc),x=c.getContext('2d');
  if(CAM.facing==='user'){x.translate(c.width,0);x.scale(-1,1)}
  x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const fl=$('#flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),30);Snd.shutter();
  stopCam();usePhoto(c);
}

const RV={photo:null,mask:null,box:null,W:0,H:0,kx:.5,ky:.5,busy:false,ov:null};
const rvc=$('#rvc'),rg=rvc.getContext('2d');
function usePhoto(c){RV.photo=c;RV.mask=null;RV.ov=null;RV.W=c.width;RV.H=c.height;show('review');layoutReview();segmentAt(.5,.5)}
function layoutReview(){const r=rvc.getBoundingClientRect();rvc.width=Math.round(r.width*DPR);rvc.height=Math.round(r.height*DPR);drawReview()}
function rvFit(){const W=rvc.width/DPR,H=rvc.height/DPR,s=Math.min((W-24)/RV.W,(H-12)/RV.H);return{s,x:(W-RV.W*s)/2,y:(H-RV.H*s)/2}}
function drawReview(now){
  if(!RV.photo||!$('#review').classList.contains('on'))return;
  const f=rvFit();rg.setTransform(DPR,0,0,DPR,0,0);rg.clearRect(0,0,rvc.width,rvc.height);
  rg.save();rg.shadowColor='rgba(0,0,0,.4)';rg.shadowBlur=20;rg.beginPath();rr(rg,f.x,f.y,RV.W*f.s,RV.H*f.s,14);rg.fillStyle='#000';rg.fill();rg.restore();
  rg.save();rg.beginPath();rr(rg,f.x,f.y,RV.W*f.s,RV.H*f.s,14);rg.clip();rg.drawImage(RV.photo,f.x,f.y,RV.W*f.s,RV.H*f.s);
  if(RV.ov)rg.drawImage(RV.ov,f.x,f.y,RV.W*f.s,RV.H*f.s);
  if(RV.busy){const t=(performance.now()/1200)%1,yy=f.y+RV.H*f.s*t;const gr=rg.createLinearGradient(0,yy-60,0,yy);gr.addColorStop(0,'rgba(255,207,51,0)');gr.addColorStop(1,'rgba(255,207,51,.45)');rg.fillStyle=gr;rg.fillRect(f.x,yy-60,RV.W*f.s,60)}

  if(RV.busy)requestAnimationFrame(drawReview);
}
function setRv(t,busy){$('#rvStatus').innerHTML=(busy?'<span class="spin"></span>':'')+t}
async function segmentAt(kx,ky){
  if(RV.busy)return;RV.busy=true;RV.kx=kx;RV.ky=ky;RV.ov=null;$('#btnMake').disabled=true;
  setRv(SEG.state==='ready'?'AI 摳緊底…':SEG.state==='loading'?'載入 AI 同摳緊底…':'摳緊底…',true);drawReview();
  await new Promise(r=>setTimeout(r,30));
  let res;try{res=await SEG.run(RV.photo,kx,ky)}catch(e){console.warn(e);res=fallbackSeg(RV.photo,kx,ky)}
  const cm=cleanMask(res.m,res.W,res.H,kx,ky);RV.busy=false;
  if(!cm.ok){RV.mask=null;setRv(cm.msg,false);drawReview();return}
  RV.mask=cm.mask;RV.box=cm.box;RV.mW=res.W;RV.mH=res.H;
  const mc=maskCanvas(cm.mask,res.W,res.H),ov=mkCanvas(res.W,res.H),o=ov.getContext('2d');
  o.fillStyle='rgba(15,14,30,.62)';o.fillRect(0,0,res.W,res.H);o.globalCompositeOperation='destination-out';o.drawImage(mc,0,0);o.globalCompositeOperation='source-over';
  const ring=mkCanvas(res.W,res.H),r=ring.getContext('2d'),rad=Math.max(2,res.W/160);for(let k=0;k<16;k++){const a=k/16*TAU;r.drawImage(mc,Math.cos(a)*rad,Math.sin(a)*rad)}
  r.globalCompositeOperation='source-in';r.fillStyle='#fff';r.fillRect(0,0,res.W,res.H);r.globalCompositeOperation='destination-out';r.drawImage(mc,0,0);o.drawImage(ring,0,0);ring.width=mc.width=0;
  RV.ov=ov;$('#btnMake').disabled=false;Snd.pop();
  setRv((res.ai?'AI 摳好咗':'簡易模式摳好咗')+' · 唔啱就撳另一件物件',false);drawReview();
}
rvc.addEventListener('pointerup',e=>{if(RV.busy||!RV.photo)return;const r=rvc.getBoundingClientRect(),f=rvFit(),x=(e.clientX-r.left-f.x)/(RV.W*f.s),y=(e.clientY-r.top-f.y)/(RV.H*f.s);if(x<0||y<0||x>1||y>1)return;segmentAt(x,y)});

const page=$('#page');
const AL={cur:0,sel:null,pw:0,ph:0,U:1,cache:new Map(),tcache:new Map()};
const recById=id=>DB.inv.find(r=>r.id===id);
function placedIds(){const s=new Set();DB.pages.forEach(p=>p.forEach(it=>s.add(it.id)));return s}
async function openAlbum(){show('album');AL.sel=null;AL.cur=Math.min(AL.cur,DB.pages.length-1);await ensureImgs(DB.inv);requestAnimationFrame(()=>{layoutAlbum();renderPage();renderTray()})}
function layoutAlbum(){const r=$('#pagewrap').getBoundingClientRect();const pw=Math.max(120,Math.min(r.width-28,(r.height-24)*.75));AL.pw=pw;AL.ph=pw/.75;AL.U=pw/720;page.style.width=pw+'px';page.style.height=AL.ph+'px'}
function itemCanvas(rec){
  const ppu=clamp(AL.U*DPR*1.7,.5,2.4),c=AL.cache.get(rec.id);if(c&&c._ppu>=ppu*.9)return c;
  const n=renderRecord(rec,ppu);n._ppu=ppu;AL.cache.set(rec.id,n);return n;
}
function elFor(id){return page.querySelector(`.item[data-id="${id}"]`)}
function posItem(el,it,rec){el.style.width=rec.w*AL.U+'px';el.style.height=rec.h*AL.U+'px';el.style.transform=`translate(${it.x*AL.pw}px,${it.y*AL.ph}px) translate(-50%,-50%) rotate(${it.r}rad) scale(${it.s})`}
function renderPage(){
  page.querySelectorAll('.item').forEach(e=>e.remove());
  const items=DB.pages[AL.cur];
  for(const it of items){const rec=recById(it.id);if(!rec||!hasImg(rec))continue;const el=document.createElement('div');el.className='item'+(AL.sel===it.id?' sel':'');el.dataset.id=it.id;el.appendChild(itemCanvas(rec));page.insertBefore(el,$('#hDel'));posItem(el,it,rec)}
  $('#pageEmpty').style.display=items.length?'none':'grid';
  $('#pgLbl').textContent=`${AL.cur+1} / ${DB.pages.length}`;updateSel();
}
function selItem(){return AL.sel?DB.pages[AL.cur].find(i=>i.id===AL.sel):null}
function select(id){
  AL.sel=id;const arr=DB.pages[AL.cur];
  if(id){const i=arr.findIndex(x=>x.id===id);if(i>=0&&i<arr.length-1){arr.push(arr.splice(i,1)[0]);const el=elFor(id);el&&page.insertBefore(el,$('#hDel'))}}
  page.querySelectorAll('.item').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));updateSel();
}
function updateSel(){
  const it=selItem(),d=$('#hDel'),rs=$('#hRs');if(!it){d.classList.remove('on');rs.classList.remove('on');return}
  const rec=recById(it.id),hw=rec.w*AL.U*it.s/2+12,hh=rec.h*AL.U*it.s/2+12,c=Math.cos(it.r),s=Math.sin(it.r),cx=it.x*AL.pw,cy=it.y*AL.ph;
  const P=(ax,ay)=>[cx+ax*c-ay*s,cy+ax*s+ay*c];
  const [ax,ay]=P(hw,hh),[bx,by]=P(-hw,-hh);
  rs.style.left=clamp(ax,14,AL.pw-14)+'px';rs.style.top=clamp(ay,14,AL.ph-14)+'px';d.style.left=clamp(bx,14,AL.pw-14)+'px';d.style.top=clamp(by,14,AL.ph-14)+'px';
  d.classList.add('on');rs.classList.add('on');
}
function renderTray(){
  const placed=placedIds(),list=DB.inv.filter(r=>!placed.has(r.id)&&hasImg(r)).reverse(),tl=$('#trayList');
  $('#trayN').textContent=list.length;tl.innerHTML='';
  if(!list.length){tl.innerHTML='<div class="trayempty">冇未貼嘅貼紙 · 去撕多啲啦！</div>';return}
  for(const rec of list){
    const d=document.createElement('div');d.className='thumb';d.dataset.id=rec.id;
    let c=AL.tcache.get(rec.id);if(!c){c=renderRecord(rec,64/Math.max(rec.w,rec.h)*DPR);AL.tcache.set(rec.id,c)}
    c.style.width=(rec.w/Math.max(rec.w,rec.h)*64)+'px';d.appendChild(c);
    const bd=document.createElement('span');bd.className='badge '+(rec.g==='perfect'?'p':rec.g==='torn'?'t':'');d.appendChild(bd);
    tl.appendChild(d);
  }
}
function placeSticker(id,x,y){
  const it={id,x:clamp(x,0,1),y:clamp(y,0,1),r:(Math.random()-.5)*.35,s:1};DB.pages[AL.cur].push(it);AL.sel=id;renderPage();renderTray();save();Snd.pop();return it;
}
function pagePt(e){const r=page.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
const ptrs=new Map();let act=null,trayDrag=null;
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
page.addEventListener('pointerdown',e=>{
  Snd.init();e.preventDefault();const pr=pagePt(e);ptrs.set(e.pointerId,pr);try{page.setPointerCapture(e.pointerId)}catch(_){}
  const it=selItem();
  if(ptrs.size===2&&it){const[a,b]=[...ptrs.values()];act={mode:'pinch',d0:dist(a,b)||1,a0:ang(a,b),s0:it.s,r0:it.r};return}
  if(e.target.closest('#hDel')){if(it){DB.pages[AL.cur]=DB.pages[AL.cur].filter(x=>x!==it);AL.sel=null;renderPage();renderTray();save()}act=null;return}
  if(e.target.closest('#hRs')&&it){const c={x:it.x*AL.pw,y:it.y*AL.ph};act={mode:'rs',pid:e.pointerId,c,d0:dist(c,pr)||1,a0:ang(c,pr),s0:it.s,r0:it.r};return}
  const el=e.target.closest('.item');
  if(el){select(el.dataset.id);const t=selItem();act={mode:'move',pid:e.pointerId,ox:pr.x-t.x*AL.pw,oy:pr.y-t.y*AL.ph};return}
  select(null);act=null;
});
$('#trayList').addEventListener('pointerdown',e=>{const t=e.target.closest('.thumb');if(!t)return;Snd.init();trayDrag={pid:e.pointerId,id:t.dataset.id,sx:e.clientX,sy:e.clientY}});
window.addEventListener('pointermove',e=>{
  if(trayDrag&&e.pointerId===trayDrag.pid){
    const dx=e.clientX-trayDrag.sx,dy=e.clientY-trayDrag.sy;
    if(dy<-14&&Math.abs(dy)>Math.abs(dx)){
      try{page.setPointerCapture(e.pointerId)}catch(_){}
      const pr=pagePt(e);placeSticker(trayDrag.id,pr.x/AL.pw,pr.y/AL.ph);ptrs.set(e.pointerId,pr);act={mode:'move',pid:e.pointerId,ox:0,oy:0};trayDrag=null;
    }
    return;
  }
  if(!ptrs.has(e.pointerId))return;const pr=pagePt(e);ptrs.set(e.pointerId,pr);const it=selItem();if(!act||!it)return;
  if(act.mode==='move'&&e.pointerId===act.pid){it.x=clamp((pr.x-act.ox)/AL.pw,0,1);it.y=clamp((pr.y-act.oy)/AL.ph,0,1)}
  else if(act.mode==='rs'&&e.pointerId===act.pid){it.s=clamp(act.s0*dist(act.c,pr)/act.d0,.25,4);it.r=act.r0+ang(act.c,pr)-act.a0}
  else if(act.mode==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];it.s=clamp(act.s0*dist(a,b)/act.d0,.25,4);it.r=act.r0+ang(a,b)-act.a0}
  else return;
  const el=elFor(it.id);el&&posItem(el,it,recById(it.id));updateSel();
});
const endAll=e=>{
  if(trayDrag&&e.pointerId===trayDrag.pid){const moved=Math.hypot(e.clientX-trayDrag.sx,e.clientY-trayDrag.sy);if(moved<10&&e.type==='pointerup')placeSticker(trayDrag.id,.5+(Math.random()-.5)*.2,.45+(Math.random()-.5)*.2);trayDrag=null}
  if(ptrs.has(e.pointerId)){ptrs.delete(e.pointerId);if(act&&act.mode==='pinch'&&ptrs.size<2)act=null;if(ptrs.size===0){if(act)save();act=null}}
};
window.addEventListener('pointerup',endAll);window.addEventListener('pointercancel',endAll);
page.addEventListener('wheel',e=>{const it=selItem();if(!it)return;e.preventDefault();if(e.shiftKey)it.r+=e.deltaY*.004;else it.s=clamp(it.s*Math.exp(-e.deltaY*.0015),.25,4);const el=elFor(it.id);el&&posItem(el,it,recById(it.id));updateSel();clearTimeout(AL.wt);AL.wt=setTimeout(save,300)},{passive:false});
